<!DOCTYPE html>
<html lang="id" data-popup-size="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>YT Music Scrobbler</title>
</head>
<body>
  <header class="header">
    <h1>YT Music Scrobbler</h1>
    <div class="header-actions">
      <button id="optionsBtn" class="icon-btn" type="button" title="Pengaturan" aria-label="Buka halaman pengaturan">⚙</button>
      <div class="size-selector" role="group" aria-label="Ukuran popup">
        <button class="size-btn" data-size="small" type="button" title="Kecil" aria-label="Ukuran kecil">S</button>
        <button class="size-btn" data-size="medium" type="button" title="Sedang" aria-label="Ukuran sedang">M</button>
        <button class="size-btn" data-size="large" type="button" title="Besar" aria-label="Ukuran besar">L</button>
      </div>
    </div>
  </header>

  <section class="master-toggle" aria-label="Kontrol ekstensi">
    <label for="masterEnabled" class="switch-label">
      <input id="masterEnabled" type="checkbox" role="switch" checked aria-checked="true">
      <span class="switch-slider" aria-hidden="true"></span>
      <span class="switch-text" id="masterLabel">Aktif</span>
    </label>
    <span id="masterHint" class="hint">Nonaktifkan untuk menghentikan semua otomatisasi</span>
  </section>

  <section id="nowPlayingCard" class="now-playing" aria-label="Sedang diputar" hidden>
    <div class="np-track">
      <span class="np-title" id="npTitle">(judul tidak terdeteksi)</span>
      <span class="np-artist" id="npArtist"></span>
    </div>
    <div class="np-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progres">
      <div class="np-bar" id="npBar"></div>
    </div>
    <div class="np-meta">
      <span class="np-time" id="npTime">0:00 / 0:00</span>
      <span class="np-badges" id="npBadges"></span>
    </div>
    <div class="np-transport" aria-label="Kontrol transport">
      <button id="npPrevBtn" class="np-btn" type="button" title="Sebelumnya" aria-label="Sebelumnya">⏮</button>
      <button id="npPlayBtn" class="np-btn" type="button" title="Play / Pause" aria-label="Play / Pause">⏯</button>
      <button id="npNextBtn" class="np-btn" type="button" title="Berikutnya" aria-label="Berikutnya">⏭</button>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Navigasi utama">
    <button id="tabPlayerBtn" class="active" type="button" role="tab" aria-selected="true">Player</button>
    <button id="tabQueueBtn" type="button" role="tab" aria-selected="false">Antrean</button>
    <button id="tabHistoryBtn" type="button" role="tab" aria-selected="false">Histori</button>
  </nav>

  <div id="status" class="status" role="status" aria-live="polite">Memuat…</div>

  <section id="playerSection" role="tabpanel" aria-label="Player">
    <fieldset class="quick-toggles" aria-label="Pengaturan cepat">
      <legend>Cepat</legend>
      <div class="toggle-grid">
        <label class="toggle-row">
          <input id="adSkipEnable" type="checkbox" checked>
          <span>Skip iklan</span>
        </label>
        <label class="toggle-row">
          <input id="randomModeBtn" type="button" value="off">
          <span id="randomModeLabel">Random: off</span>
        </label>
        <label class="toggle-row">
          <input id="shuffleEnable" type="checkbox">
          <span>Shuffle</span>
        </label>
        <label class="toggle-row">
          <input id="loopModeBtn" type="button" value="off">
          <span id="loopModeLabel">Loop: off</span>
        </label>
      </div>
    </fieldset>

    <fieldset class="queue-editor" aria-label="Tambah ke antrean">
      <legend>Antrean Baru</legend>
      <textarea id="songList" maxlength="20000" placeholder="Satu lagu per baris. Contoh: Demons - Jacob Lee&#10;Gamelan Reggae - eL Utama" aria-label="Daftar lagu"></textarea>
      <div class="queue-actions">
        <button id="shuffleOnStart" type="button">Acak saat mulai</button>
        <button id="startBtn" type="button" class="primary">▶ Mulai Playlist</button>
      </div>
    </fieldset>

    <h3>Antrean Saat Ini:</h3>
    <ul id="queueList"></ul>
  </section>

  <section id="queueSection" role="tabpanel" aria-label="Antrean" hidden>
    <p class="placeholder">Antrean detail hanya di tab Player.</p>
  </section>

  <section id="historySection" role="tabpanel" aria-label="Histori" hidden>
    <div class="history-actions">
      <button id="clearHistoryBtn" type="button">Hapus Histori</button>
      <button id="exportCsvBtn" type="button">Export CSV</button>
    </div>
    <ul id="historyList"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
