<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>YT Music Scrobbler</title>
</head>
<body>
  <div class="title-row">
    <h2>YT Music Player</h2>
    <div class="display-settings" role="group" aria-label="Ukuran popup">
      <button class="size-btn" data-size="small" type="button" title="Ukuran kecil">S</button>
      <button class="size-btn active" data-size="medium" type="button" title="Ukuran sedang">M</button>
      <button class="size-btn" data-size="large" type="button" title="Ukuran besar">L</button>
    </div>
  </div>

  <div class="extension-toggle-row">
    <label for="extensionEnabled">Kontrol ekstensi</label>
    <label class="switch-control">
      <input id="extensionEnabled" type="checkbox" checked>
      <span class="switch-slider" aria-hidden="true"></span>
      <span id="extensionEnabledLabel">Aktif</span>
    </label>
  </div>

  <div class="tabs" role="tablist" aria-label="Navigasi">
    <button id="tabPlaylistBtn" class="active" type="button">Playlist</button>
    <button id="tabHistoryBtn" type="button">Histori (Scrobble)</button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite">Memuat…</div>

  <section id="playlistSection" aria-label="Playlist">
    <label for="songList">Paste daftar lagu whitelist, satu per baris:</label>
    <textarea id="songList" maxlength="20000" placeholder="Demons - Jacob Lee&#10;Gamelan Reggae - eL Utama"></textarea>
    <button id="startBtn" type="button">▶ Mulai Playlist Baru</button>

    <div class="shuffle-row" aria-label="Acak antrean">
      <label><input id="shuffleEnable" type="checkbox"> Acak urutan antrean saat memulai</label>
    </div>

    <div class="random-duration" aria-label="Durasi acak">
      <label><input id="randomEnable" type="checkbox"> Durasi acak (min–max detik)</label>
      <div class="random-inputs">
        <label for="randomMin">Min</label>
        <input id="randomMin" type="number" min="0" placeholder="40" title="Durasi minimal menonton (detik)">
        <label for="randomMax">Max</label>
        <input id="randomMax" type="number" min="0" placeholder="60" title="Durasi maksimal menonton (detik)">
      </div>
    </div>

    <div class="ad-skip" aria-label="Skip iklan otomatis">
      <label><input id="adSkipEnable" type="checkbox"> Skip iklan otomatis</label>
      <div class="ad-skip-inputs">
        <label for="adSkipMinDelay">Min delay (ms)</label>
        <input id="adSkipMinDelay" type="number" min="0" placeholder="5000" title="Delay minimal sebelum coba skip (ms)">
        <label for="adSkipMaxWait">Max wait (ms)</label>
        <input id="adSkipMaxWait" type="number" min="0" placeholder="30000" title="Setelah waktu ini upaya skip dianggap paksa (ms)">
      </div>
    </div>

    <div class="player-controls" aria-label="Kontrol pemutaran">
      <button id="prevBtn" type="button" title="Sebelumnya">⏮</button>
      <button id="togglePlayBtn" type="button" title="Play / Pause">⏯</button>
      <button id="nextBtn" type="button" title="Skip; scrobble hanya jika memenuhi syarat">⏭</button>
    </div>

    <h3>Antrean Saat Ini:</h3>
    <ul id="queueList"></ul>
  </section>

  <section id="historySection" aria-label="Histori" style="display: none;">
    <div class="history-actions">
      <button id="clearHistoryBtn" type="button">Hapus Histori</button>
      <button id="exportCsvBtn" type="button">Export CSV</button>
    </div>
    <ul id="historyList"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
