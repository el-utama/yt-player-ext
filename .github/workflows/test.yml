name: Test & Build

on:
  push:
    branches: [main, stable/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check for build drift
        run: |
          # Ensure built artifacts match what would be produced from source
          git diff --exit-code -- background.js background.js.map popup.js popup.js.map options.js options.js.map || (
            echo "::error::Build drift detected! Run 'npm run build' and commit the updated artifacts."
            exit 1
          )
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: |
            background.js
            background.js.map
            content.js
            content.js.map
            popup.js
            popup.js.map
            options.js
            options.js.map
            manifest.json
            popup.html
            options.html
            styles.css
            options.css

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-build
          path: dist
      - name: Create ZIP
        run: |
          cd dist
          zip -r ../yt-player-ext-${{ github.ref_name }}.zip .
      - name: Generate SHA256
        run: |
          sha256sum yt-player-ext-${{ github.ref_name }}.zip > yt-player-ext-${{ github.ref_name }}.zip.sha256
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            yt-player-ext-${{ github.ref_name }}.zip
            yt-player-ext-${{ github.ref_name }}.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}